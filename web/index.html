<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090d" />
    <meta name="description" content="OFD: your morning briefing, of the day." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OFD" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>OFD · Of the Day</title>
    <style>
      /* first paint before the JS bundle arrives; React replaces #root's content on mount */
      html, body { background: #08090d; margin: 0; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #f2f3f8; font: 800 26px/1 system-ui, -apple-system, sans-serif; letter-spacing: -0.03em; }
      .boot-row { display: flex; align-items: center; gap: 10px; }
      .boot-dot { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #6f86ff, #9a73ff); box-shadow: 0 0 0 5px rgba(111, 134, 255, 0.18), 0 0 22px rgba(139, 157, 255, 0.6); animation: boot-breathe 1.6s ease-in-out infinite; }
      .boot-bar { width: 72px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #6f86ff, #9a73ff); animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-breathe { 50% { transform: scale(1.18); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-dot, .boot-bar i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading OFD"><div class="boot-row"><span class="boot-dot"></span>OFD</div><div class="boot-bar"><i></i></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
